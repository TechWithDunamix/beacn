[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beacn"
version = "0.1.0"
description = "Centralized realtime event, task, notification and message infrastructure for backend applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Sillo is the whole framework layer: routing, middleware, sessions, auth,
    # RBAC, the Record ORM, migrations, the console, the queue, WebSockets.
    # `jwt` is required at runtime — app.auth mints realtime tokens with it.
    "sillo-framework[cache,hashing-bcrypt,record,jwt]==0.3.2.dev1",
    "sillo-inertia==0.1.0.dev1",
    "sillo-wire==0.1.0.dev1",
    # ORM — models, migrations, and query layer. aiosqlite for local/dev SQLite,
    # asyncpg for production Postgres (both kept as core so the app boots in any
    # environment without extra install steps).
    "tortoise-orm>=0.21.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    # ASGI server — needed to run `uvicorn app.main:app` and for the `beacn
    # serve` CLI command; [standard] pulls in uvloop + httptools for performance.
    "uvicorn[standard]>=0.30.0",
    # WebSocket support — sillo.websockets wraps the standard `websockets`
    # library; required for the realtime endpoint at /realtime.
    "websockets>=12.0",
    # Redis — cross-instance event fanout (RedisBus) and the optional Redis
    # queue backend. Kept as a core dep so the import path works regardless of
    # which bus backend is configured at runtime.
    "redis>=5.0.0",
    # The `beacn` console script (cli/) is a runtime entrypoint — `beacn
    # migrate`, `beacn user`, `beacn doctor` all load cli.client, which uses
    # httpx for the control-plane API calls. Not optional. Cap below 1.0 — the
    # 1.0 dev line drops httpx.ASGITransport, which the test client needs.
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
beacn = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "domain", "database", "routes", "realtime", "observability", "integrations", "cli"]

[tool.pytest.ini_options]
# The SDK suite lives under sdk/python/tests and is run separately (it starts a
# real uvicorn server); collecting both trees at once clashes on the package
# name `tests`.
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["database/migrations", "sdk/typescript"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E402"]
# The SDK targets Python 3.8 (no `X | Y`, uses `# type:` comments) and
# deliberately re-raises structured errors after exhausting retries.
"sdk/python/beacn.py" = ["UP", "B904"]
